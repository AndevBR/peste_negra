<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="t">
<title id="t">Ciclo de transmissão da peste</title>
<desc>Roedores e suas pulgas mantêm a bactéria na natureza. A picada de pulgas infectadas pode transmitir a peste às pessoas, causando a forma bubônica. Na forma pneumônica, a bactéria passa de pessoa para pessoa por gotículas respiratórias. Pulgas humanas e piolhos são uma hipótese debatida para parte dos surtos medievais.</desc>
