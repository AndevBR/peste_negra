      <text x="128" y="46" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="bold" fill="#7a1f2b" text-anchor="middle">Septicêmica</text>
      <g transform="translate(128 218)"><g stroke="#1b1411" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
      <circle cx="0" cy="-118" r="26" fill="#e6d3b0"/>
      <path d="M-34 -84 Q0 -96 34 -84 L44 0 L30 4 L26 -46 L22 30 L26 118 L6 118 L0 40 L-6 118 L-26 118 L-22 30 L-26 -46 L-30 4 L-44 0 Z" fill="#e6d3b0"/>
    </g><g stroke="#7a1f2b" stroke-width="3" fill="none" stroke-linecap="round" opacity=".85">
      <path d="M0 -84 L0 30 M0 -70 L-32 0 M0 -70 L32 0 M0 30 L-14 116 M0 30 L14 116 M0 -60 Q-12 -40 -20 -20 M0 -40 Q12 -20 18 0"/></g></g>
