      <text x="128" y="360" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="normal" fill="#1b1411" text-anchor="middle">atinge os pulmões;</text><text x="128" y="378" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="normal" fill="#1b1411" text-anchor="middle">passa por gotículas</text>
