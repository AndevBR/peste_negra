    </g><g transform="translate(524 0)">
      <rect x="10" y="10" width="236" height="380" rx="18" fill="#f7eedb" stroke="#d9c294" stroke-width="3"/>
      <text x="128" y="46" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="bold" fill="#7a1f2b" text-anchor="middle">Pneumônica</text>
      <g transform="translate(128 218)"><g stroke="#1b1411" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
      <circle cx="0" cy="-118" r="26" fill="#e6d3b0"/>
