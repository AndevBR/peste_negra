<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" role="img" aria-labelledby="t">
<title id="t">As três formas clínicas da peste</title>
<desc>Peste bubônica: ínguas inchadas (bubões) no pescoço, axilas e virilha. Peste septicêmica: a bactéria se espalha pelo sangue. Peste pneumônica: atinge os pulmões e pode passar entre pessoas por gotículas.</desc>
<g transform="translate(0 0)">
      <rect x="10" y="10" width="236" height="380" rx="18" fill="#f7eedb" stroke="#d9c294" stroke-width="3"/>
      <text x="128" y="46" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="bold" fill="#7a1f2b" text-anchor="middle">Bubônica</text>
      <g transform="translate(128 218)"><g stroke="#1b1411" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
      <circle cx="0" cy="-118" r="26" fill="#e6d3b0"/>
      <path d="M-34 -84 Q0 -96 34 -84 L44 0 L30 4 L26 -46 L22 30 L26 118 L6 118 L0 40 L-6 118 L-26 118 L-22 30 L-26 -46 L-30 4 L-44 0 Z" fill="#e6d3b0"/>
    </g><circle cx="-14" cy="-96" r="9" fill="#7a1f2b" stroke="#1b1411" stroke-width="2"/><circle cx="-14" cy="-96" r="15" fill="none" stroke="#7a1f2b" stroke-width="2" opacity=".5"/><circle cx="-30" cy="-60" r="9" fill="#7a1f2b" stroke="#1b1411" stroke-width="2"/><circle cx="-30" cy="-60" r="15" fill="none" stroke="#7a1f2b" stroke-width="2" opacity=".5"/><circle cx="30" cy="-60" r="9" fill="#7a1f2b" stroke="#1b1411" stroke-width="2"/><circle cx="30" cy="-60" r="15" fill="none" stroke="#7a1f2b" stroke-width="2" opacity=".5"/><circle cx="-14" cy="24" r="9" fill="#7a1f2b" stroke="#1b1411" stroke-width="2"/><circle cx="-14" cy="24" r="15" fill="none" stroke="#7a1f2b" stroke-width="2" opacity=".5"/><circle cx="14" cy="24" r="9" fill="#7a1f2b" stroke="#1b1411" stroke-width="2"/><circle cx="14" cy="24" r="15" fill="none" stroke="#7a1f2b" stroke-width="2" opacity=".5"/></g>
      <text x="128" y="360" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="normal" fill="#1b1411" text-anchor="middle">ínguas inchadas</text><text x="128" y="378" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="normal" fill="#1b1411" text-anchor="middle">(bubões)</text>
    </g><g transform="translate(262 0)">
