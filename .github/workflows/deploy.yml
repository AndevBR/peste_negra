# Testa o site e publica no GitHub Pages.
# Antes do primeiro uso: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Testar e publicar no GitHub Pages

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  testes:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verificar vulnerabilidades conhecidas nas dependências
        run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - name: Build de verificação
        run: npm run build
      - run: npm run test:unit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: relatorio-playwright
          path: playwright-report/
          retention-days: 7

  publicar:
    name: Publicar
    needs: testes
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: pages
        uses: actions/configure-pages@v5
      # A URL pública vem do próprio GitHub Pages (ou de um domínio próprio configurado lá).
      # Ela é gravada no QR Code, no sitemap e nos metadados de compartilhamento.
      - name: Build de produção
        run: node scripts/build.mjs --url "${{ steps.pages.outputs.base_url }}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
